# FIXTURE — offline only; publishable templates live in
# https://github.com/Alibaba-Agent-Sandbox/awesome-templates
specVersion: 1
name: python-hello
sandbox:
  provider: alicloud-express
  template:
    source:
      dockerfile: Dockerfile
  services:
    app:
      protocol: agent-sandbox-server
      version: 2
      port: 9000
      operations:
      - commands.list
      - commands.run
  instance:
    envs:
      LANG: C.UTF-8
  start: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
