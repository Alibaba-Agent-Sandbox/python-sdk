[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sandbox-server"
dynamic = ["version"]
description = "Agent Sandbox Server SDK — container-side runtime service for Agent Sandbox templates"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Anycodes" },
]
keywords = ["sandbox", "easy", "ai", "agent", "cloud", "e2b", "server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The HTTP server itself is stdlib-only.  ``websockets`` is needed only by the
# PTY terminal endpoint, which is enabled by default.
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.scripts]
agent-sandbox-server = "agent_sandbox.server.__main__:main"

[project.urls]
Homepage = "https://github.com/alibaba-agent-sandbox/python-sdk"
Documentation = "https://github.com/alibaba-agent-sandbox/python-sdk/tree/main/docs"
Repository = "https://github.com/alibaba-agent-sandbox/python-sdk"
Issues = "https://github.com/alibaba-agent-sandbox/python-sdk/issues"
Changelog = "https://github.com/alibaba-agent-sandbox/python-sdk/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/agent_sandbox/server/_version.py"

# ``agent_sandbox`` is a shared namespace with the ``agent-sandbox`` (client) distribution: this
# distribution only ships ``agent_sandbox/server`` and deliberately has no
# ``agent_sandbox/__init__.py`` of its own.
[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox"]
artifacts = ["py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agent_sandbox/",
    "tests/",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring real API keys (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
