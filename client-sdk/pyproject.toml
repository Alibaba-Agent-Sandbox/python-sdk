[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sandbox-client"
dynamic = ["version"]
description = "Agent Sandbox SDK — Create, manage, and interact with cloud sandboxes for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Anycodes" },
]
keywords = ["sandbox", "ai", "agent", "cloud", "alibaba-cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx[http2]>=0.27,<1",
    "httpcore>=1.0.5,<2",
    "h2>=4,<5",
    "python-dateutil>=2.8.2",
    "attrs>=23.2",
    "packaging>=24.1",
    "typing-extensions>=4.1",
    "wcmatch>=10.1,<11",
    "dockerfile-parse>=2.0.1,<3",
    "rich>=14",
    "websockets>=16.1.1",
    "pydantic>=2.14.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "protobuf>=5",
    "tomli>=2.0; python_version < '3.11'",
    # The client uses the matching local server runtime for its server/declarative helpers.
    # Keep the required distribution version equal to ``_version.py``.
    "agent-sandbox-server==0.3.1a3",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]
fast = [
    "orjson>=3.13.0",
]
session = [
    "filelock>=3.12",
]
all = [
    "agent-sandbox-client[fast,session,mcp]",
]
dev = [
    "agent-sandbox-client[all]",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.30",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "types-PyYAML>=6.0.12.20260906",
]

[project.urls]
Homepage = "https://github.com/alibaba-agent-sandbox/python-sdk"
Documentation = "https://github.com/alibaba-agent-sandbox/python-sdk/tree/main/docs"
Repository = "https://github.com/alibaba-agent-sandbox/python-sdk"
Issues = "https://github.com/alibaba-agent-sandbox/python-sdk/issues"
Changelog = "https://github.com/alibaba-agent-sandbox/python-sdk/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/agent_sandbox/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox"]
artifacts = ["py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agent_sandbox/",
    "tests/",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring real API keys (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "src/agent_sandbox/_standard", "src/agent_sandbox/code_interpreter"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert 语句在测试中是正常的

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["src/agent_sandbox/_standard/", "src/agent_sandbox/code_interpreter/"]

# ``tomli`` is only present as a fallback on older interpreters (the stdlib ``tomllib`` is
# unavailable before Python 3.11).
[[tool.mypy.overrides]]
module = [
    "tomli",
]
ignore_missing_imports = true
follow_imports = "skip"

# The pinned protocol port retains upstream generated schemas and typing style.
[[tool.mypy.overrides]]
module = ["agent_sandbox._standard.*", "agent_sandbox.code_interpreter.*"]
follow_imports = "skip"
ignore_errors = true
