[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy-sandbox"
dynamic = ["version"]
description = "Easy Sandbox SDK — Create, manage, and interact with cloud sandboxes for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Anycodes" },
]
keywords = ["sandbox", "easy", "ai", "agent", "cloud", "e2b"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx[http2]>=0.27",
    "websockets>=12.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = [
    "starlette>=0.37",
    "uvicorn>=0.29",
]
fast = [
    "orjson>=3.9",
]
declarative = [
    "pyyaml>=6.0",
]
session = [
    "filelock>=3.12",
]
alicloud = [
    "alibabacloud-fcsandbox20260509>=1.6.0",
]
# Container-side runtime (``easy_sandbox.server``), shipped as a separate
# distribution (``python-sdk/server-sdk``) so sandbox images do not need the
# client stack.  Needed locally by the ``@sandbox`` decorator's server proxy.
server = [
    "easy-sandbox-server",
]
all = [
    "easy-sandbox[fast,session,mcp,declarative,alicloud,server]",
]
dev = [
    "easy-sandbox[all]",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.30",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Easy-Sandbox/easy-sandbox"
Documentation = "https://github.com/Easy-Sandbox/easy-sandbox/tree/main/docs"
Repository = "https://github.com/Easy-Sandbox/easy-sandbox"
Issues = "https://github.com/Easy-Sandbox/easy-sandbox/issues"
Changelog = "https://github.com/Easy-Sandbox/easy-sandbox/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/easy_sandbox/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_sandbox"]
artifacts = ["py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "src/easy_sandbox/",
    "tests/",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring real API keys (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert 语句在测试中是正常的

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# Optional third-party dependencies that ship no type stubs (alicloud SDK)
# or are only present as a fallback on older interpreters (tomli, used when
# the stdlib ``tomllib`` is unavailable before Python 3.11).
[[tool.mypy.overrides]]
module = [
    "alibabacloud_fcsandbox20260509",
    "alibabacloud_fcsandbox20260509.*",
    "alibabacloud_tea_openapi.*",
    "tomli",
]
ignore_missing_imports = true
