syntax = "proto3";

package agent_sandbox.engine;

// Local provider engine. SDKs speak only this service, over a Unix socket.
// The engine holds backend HTTP, SSE and WebSocket connections.

service ProviderEngine {
  rpc Health(Empty) returns (HealthStatus);
  rpc Create(CreateRequest) returns (SandboxState);
  rpc Kill(SandboxRef) returns (Empty);
  rpc Exec(ExecRequest) returns (stream ExecChunk);
  rpc Terminal(stream TerminalFrame) returns (stream TerminalFrame);
  // Data plane. The engine already holds the sandbox; these carry sandbox_id only.
  rpc ExecStart(ExecStartRequest) returns (stream ExecEvent);
  rpc FileRead(FilePath) returns (stream FileChunk);
  rpc FileWrite(stream FileChunk) returns (Empty);
  rpc FileOp(FileOpRequest) returns (FileOpResult);
  rpc WatchDir(FilePath) returns (stream WatchEventMsg);
  rpc Pty(stream PtyFrame) returns (stream PtyFrame);
  rpc Op(OpRequest) returns (OpResult);
}

message HealthStatus {
  string protocol = 1;
  int32 pid = 2;
  string version = 3;
  repeated string supported_create_options = 4;
}

message CreateRequest {
  string template = 1;
  int32 timeout = 2;
  map<string, string> metadata = 3;
  map<string, string> envs = 4;
  string api_key = 5;
  string api_url = 6;
  string access_key_id = 7;
  string access_key_secret = 8;
  string region = 9;
  double request_timeout = 10;
  int32 cpu = 11;
  int32 memory = 12;
  int32 disk = 13;
  string gpu = 14;
  // Empty or "alicloud-express" uses the platform API. Any other id is rejected.
  // Catalog providers, including opensandbox, are not engine adapters.
  string provider = 15;
  // Existing Volume names indexed by absolute sandbox mount path.
  map<string, string> volume_mounts = 16;
}

message SandboxState {
  string sandbox_id = 1;
  string template = 2;
  string status = 3;
  string envd_url = 4;
  string envd_access_token = 5;
  // Platform envdVersion. Empty when the create response omitted it.
  string envd_version = 6;
}

message SandboxRef {
  string sandbox_id = 1;
  string api_key = 2;
  string api_url = 3;
  string access_key_id = 4;
  string access_key_secret = 5;
  string region = 6;
  string provider = 7;
}

message Empty {}

message ExecRequest {
  // The engine opens this SSE URL itself and forwards each data line.
  string sse_url = 1;
}

message ExecChunk {
  string data = 1;
}

message TerminalFrame {
  // First client frame names the WebSocket. Later frames are bytes to send.
  string websocket_url = 1;
  bytes data = 2;
}

message ExecStartRequest {
  string sandbox_id = 1;
  string cmd = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string cwd = 5;
  string user = 6;
  int32 timeout = 7;
}

message ExecEvent {
  string kind = 1;
  bytes data = 2;
  int32 exit_code = 3;
  int32 pid = 4;
  bool has_exit = 5;
}

message FilePath {
  string sandbox_id = 1;
  string path = 2;
}

message FileChunk {
  string sandbox_id = 1;
  string path = 2;
  bytes data = 3;
  bool eof = 4;
}

message FileOpRequest {
  string sandbox_id = 1;
  string op = 2;
  string path = 3;
  string destination = 4;
}

message FileEntry {
  string name = 1;
  string path = 2;
  string type = 3;
  int64 size = 4;
}

message FileOpResult {
  repeated FileEntry entries = 1;
}

message WatchEventMsg {
  string type = 1;
  string path = 2;
  string old_path = 3;
}

message PtyFrame {
  string sandbox_id = 1;
  string op = 2;
  bytes data = 3;
  int32 cols = 4;
  int32 rows = 5;
}

message OpRequest {
  string op = 1;
  string sandbox_id = 2;
  string provider = 3;
  string api_key = 4;
  string api_url = 5;
  string json = 6;
}

message OpResult {
  string json = 1;
}
