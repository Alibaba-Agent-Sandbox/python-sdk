[pytest]
# Real-cloud E2E suite. Never collected by the unit CI: client-sdk and server-sdk run
# ``pytest tests/`` from their own directories. Run it with ``make e2e``.
minversion = 7.0
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    e2e: runs against the real cloud (auto-skipped when credentials are missing)
    e2e_slow: takes more than ~60 s (TTL expiry)
    known_issue: asserts the intended behaviour of a bug recorded in KNOWN-ISSUES.md (strict xfail)
filterwarnings =
    ignore::DeprecationWarning
