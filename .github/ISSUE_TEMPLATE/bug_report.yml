name: 🐛 Bug Report
description: Report a bug to help us improve
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        This repository covers the Python SDK (`client-sdk` = `agent-sandbox`, `server-sdk` = `agent-sandbox-server`): https://github.com/alibaba-agent-sandbox/python-sdk
        Bugs in the `abx` CLI belong in https://github.com/alibaba-agent-sandbox/agent-sandbox
        Bugs in the Node.js SDK belong in https://github.com/alibaba-agent-sandbox/nodejs-sdk
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - client-sdk (agent-sandbox)
        - server-sdk (agent-sandbox-server)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Install the SDK `pip install agent-sandbox-client`
        2. Run `await Sandbox.create(template="base")`
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK Version (agent-sandbox / agent-sandbox-server)
      placeholder: "0.1.0"
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux (Ubuntu)
        - Linux (CentOS/RHEL)
        - Linux (Other)
        - Windows
  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "3.10.12"
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
