name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build & Publish (agent-sandbox-server, then agent-sandbox)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            client-sdk/pyproject.toml
            server-sdk/pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Verify both distributions share one version
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          versions = {}
          for name, path in {
              "agent-sandbox": "client-sdk/src/agent_sandbox/_version.py",
              "agent-sandbox-server": "server-sdk/src/agent_sandbox/server/_version.py",
          }.items():
              match = re.search(r'__version__\s*=\s*"([^"]+)"', Path(path).read_text(encoding="utf-8"))
              if match is None:
                  sys.exit(f"cannot find __version__ in {path}")
              versions[name] = match.group(1)
          print(versions)
          if len(set(versions.values())) != 1:
              sys.exit(f"client and server versions must be released in lockstep: {versions}")
          PY

      - name: Build sdist and wheel (server-sdk)
        run: python -m build --outdir dist/server-sdk server-sdk

      - name: Build sdist and wheel (client-sdk)
        run: python -m build --outdir dist/client-sdk client-sdk

      - name: Verify distributions
        run: twine check dist/*/*

      - name: Upload agent-sandbox-server to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/server-sdk/*

      - name: Upload agent-sandbox to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/client-sdk/*
