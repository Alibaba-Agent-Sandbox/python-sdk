name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: No local paths or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for local paths and credential-like strings
        run: bash scripts/check-no-local-paths.sh

  client-sdk:
    name: client-sdk (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: client-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            client-sdk/pyproject.toml
            server-sdk/pyproject.toml

      - name: Install dependencies
        run: pip install -e ../server-sdk -e '.[dev]' hatchling

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src/agent_sandbox

      - name: Run tests
        run: pytest -v --tb=short -m 'not integration'

  server-sdk:
    name: server-sdk (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: server-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server-sdk/pyproject.toml

      - name: Install dependencies
        run: pip install -e '.[dev]' hatchling

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src/agent_sandbox/server

      - name: Run tests
        run: pytest -v --tb=short -m 'not integration'

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [client-sdk, server-sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            client-sdk/pyproject.toml
            server-sdk/pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel (server-sdk)
        run: python -m build --outdir dist/server-sdk server-sdk

      - name: Build sdist and wheel (client-sdk)
        run: python -m build --outdir dist/client-sdk client-sdk

      - name: Check distributions
        run: twine check dist/*/*

      - name: Verify py.typed is in both wheels
        run: python scripts/check_dists.py py-typed

      - name: Verify client + server install into one virtualenv and import
        run: python scripts/check_dists.py combined-install

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  standard-contract:
    name: Pinned E2B public contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project without upstream runtime packages
        run: pip install -e ./server-sdk -e './client-sdk[dev]'
      - name: Install the reference in a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/e2b-reference"
          "$RUNNER_TEMP/e2b-reference/bin/python" -m pip install 'e2b==2.31.0' 'e2b-code-interpreter==2.8.1'
      - name: Compare public callable signatures and sync/async shapes
        run: python scripts/check_standard_contract.py --reference-python "$RUNNER_TEMP/e2b-reference/bin/python"

  provider-engine:
    name: Python to Node provider engine
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: Alibaba-Agent-Sandbox/agent-sandbox
          ref: 475848c62ef1156718515bb5b6b45486366573f4
          path: .test-deps/cli
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: Alibaba-Agent-Sandbox/awesome-providers
          ref: 6dbb89a256371190e7ea34dca858c9a00ebdfc2f
          path: .test-deps/providers
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .test-deps/cli/package-lock.json
      - name: Install SDK and CLI dependencies
        run: |
          pip install -e ./server-sdk -e './client-sdk[dev]'
          npm ci --prefix .test-deps/cli
          npm run build --prefix .test-deps/cli
      - name: Run required cross-language scenarios
        env:
          ABX_TEST_ENGINE_REQUIRED: "1"
          ABX_TEST_CLI_DIR: ${{ github.workspace }}/.test-deps/cli
          ABX_TEST_PROVIDERS_DIR: ${{ github.workspace }}/.test-deps/providers
        run: python -m pytest -c client-sdk/pyproject.toml client-sdk/tests/test_providers/test_engine_provider.py -v
