name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: No local paths or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for local paths and credential-like strings
        run: bash scripts/check-no-local-paths.sh

  client-sdk:
    name: client-sdk (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: client-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            client-sdk/pyproject.toml
            server-sdk/pyproject.toml

      - name: Install dependencies
        run: pip install -e ../server-sdk -e '.[dev]' hatchling

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src/agent_sandbox

      - name: Run tests
        run: pytest -v --tb=short -m 'not integration'

  server-sdk:
    name: server-sdk (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: server-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server-sdk/pyproject.toml

      - name: Install dependencies
        run: pip install -e '.[dev]' hatchling

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src/agent_sandbox/server

      - name: Run tests
        run: pytest -v --tb=short -m 'not integration'

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [client-sdk, server-sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            client-sdk/pyproject.toml
            server-sdk/pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel (server-sdk)
        run: python -m build --outdir dist/server-sdk server-sdk

      - name: Build sdist and wheel (client-sdk)
        run: python -m build --outdir dist/client-sdk client-sdk

      - name: Check distributions
        run: twine check dist/*/*

      - name: Verify py.typed is in both wheels
        run: python scripts/check_dists.py py-typed

      - name: Verify client + server install into one virtualenv and import
        run: python scripts/check_dists.py combined-install

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  standard-contract:
    name: Pinned E2B public contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project without upstream runtime packages
        run: pip install -e ./server-sdk -e './client-sdk[dev]'
      - name: Install the reference in a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/e2b-reference"
          "$RUNNER_TEMP/e2b-reference/bin/python" -m pip install 'e2b==2.31.0' 'e2b-code-interpreter==2.8.1'
      - name: Compare public callable signatures and sync/async shapes
        run: python scripts/check_standard_contract.py --reference-python "$RUNNER_TEMP/e2b-reference/bin/python"

  provider-engine:
    name: Python to Node provider engine
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: Alibaba-Agent-Sandbox/agent-sandbox
          ref: 94a1f90244e7b36e06c4618feaa323c4d056e784
          path: .test-deps/cli
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: Alibaba-Agent-Sandbox/awesome-providers
          ref: 857a66b3884faeaade01411ec9561987a7aee705
          path: .test-deps/providers
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .test-deps/cli/package-lock.json
      - name: Install SDK and CLI dependencies
        run: |
          pip install -e ./server-sdk -e './client-sdk[dev]'
          npm ci --prefix .test-deps/cli
          npm run build --prefix .test-deps/cli
      - name: Run required cross-language scenarios
        env:
          ABX_TEST_ENGINE_REQUIRED: "1"
          ABX_TEST_CLI_DIR: ${{ github.workspace }}/.test-deps/cli
          ABX_TEST_PROVIDERS_DIR: ${{ github.workspace }}/.test-deps/providers
        run: python -m pytest -c client-sdk/pyproject.toml client-sdk/tests/test_providers/test_engine_provider.py -v

  fixture-images:
    name: Public runtime fixture (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fixture: [python-hello, agents-cli]
    steps:
      - uses: actions/checkout@v4
      - name: Build the unmodified fixture Dockerfile
        run: docker build --tag abx-sdk-fixture:current "examples/templates/${{ matrix.fixture }}"
      - name: Verify the published guest runtime
        run: |
          docker run --rm --entrypoint python3 abx-sdk-fixture:current -c 'from importlib.metadata import version; from agent_sandbox.server import start; assert version("agent-sandbox-server") == "0.4.0a3" and callable(start)'
      - name: Start the fixture and check its real HTTP application
        env:
          FIXTURE_NAME: ${{ matrix.fixture }}
        run: |
          docker run -d --name abx-sdk-fixture-server abx-sdk-fixture:current
          for attempt in 1 2 3 4 5 6; do
            if docker exec abx-sdk-fixture-server agent-sandbox-server healthcheck --port 9000; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 1
          done
          docker exec -i -e FIXTURE_NAME="$FIXTURE_NAME" abx-sdk-fixture-server python3 - <<'PYTHON'
          import json, os, urllib.request
          base = "http://127.0.0.1:9000"
          if os.environ["FIXTURE_NAME"] == "python-hello":
              request = urllib.request.Request(base + "/commands/hello", data=b'{"name":"Fixture"}', headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(request, timeout=10) as response:
                  assert json.load(response)["result"] == "Hello, Fixture!"
          else:
              with urllib.request.urlopen(base + "/v1/agents/runtimes", timeout=10) as response:
                  assert isinstance(json.load(response)["data"], list)
          PYTHON
      - name: Remove the owned fixture container and verify absence
        if: always()
        run: |
          if docker container inspect abx-sdk-fixture-server >/dev/null 2>&1; then
            docker rm -f abx-sdk-fixture-server
          fi
          docker info >/dev/null
          test -z "$(docker ps -aq --filter 'name=^abx-sdk-fixture-server$')"
