# Dependabot configuration for agent-sandbox (python-sdk)
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python (pip) dependencies — client-sdk (agent-sandbox)
  - package-ecosystem: "pip"
    directory: "/client-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10

  # Python (pip) dependencies — server-sdk (agent-sandbox-server)
  - package-ecosystem: "pip"
    directory: "/server-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    commit-message:
      prefix: "chore(ci):"
    open-pull-requests-limit: 5
